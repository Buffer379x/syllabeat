name: Release (macOS DMG)

# Baut SyllaBeat (Swift) auf Apple Silicon: Version gegen den Tag prüfen, scripts/check.sh, Release-Archiv,
# Ad-hoc-Signatur, Selbsttest der gebauten App, SyllaBeat-<Version>.dmg mit SHA-256 und GitHub Release.
# Start per Tag (`git tag v0.3.0 && git push origin v0.3.0`) oder von Hand unter Actions.

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Als Vorabversion (Pre-release) markieren"
        type: boolean
        default: true
      draft:
        description: "Nur als Entwurf anlegen (nicht veröffentlichen)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, Prüfung und Veröffentlichung
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Version lesen
        id: meta
        run: |
          VERSION=$(sed -n 's/^MARKETING_VERSION *= *//p' Config/Version.xcconfig)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zur App-Version $VERSION (Config/Version.xcconfig)."
            exit 1
          fi
          echo "SyllaBeat $VERSION"

      - name: Werkzeuge
        run: |
          sw_vers
          xcodebuild -version

      - name: Metal-Toolchain (für MLX-Shader)
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Prüfungen (scripts/check.sh)
        run: scripts/ci-run.sh 1500 scripts/check.sh

      - name: Release-Build, Signatur, Selbsttest und DMG
        run: scripts/build-release.sh "${{ github.run_number }}"

      - name: DMG prüfen
        id: dmg
        run: |
          DMG="dist/SyllaBeat-${{ steps.meta.outputs.version }}.dmg"
          test -f "$DMG" && test -f "$DMG.sha256"
          (cd dist && shasum -a 256 -c "$(basename "$DMG").sha256")
          SIZE=$(stat -f %z "$DMG")
          echo "DMG: $((SIZE / 1000000)) MB"
          [ "$SIZE" -lt 60000000 ] || echo "::warning::DMG ist größer als 60 MB."
          echo "path=$DMG" >> "$GITHUB_OUTPUT"

      - name: Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: SyllaBeat-${{ steps.meta.outputs.version }}
          path: |
            ${{ steps.dmg.outputs.path }}
            ${{ steps.dmg.outputs.path }}.sha256
          retention-days: 14

      - name: GitHub Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          DMG: ${{ steps.dmg.outputs.path }}
          PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || 'false' }}
          DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || 'false' }}
        run: |
          NOTES="build/release-notes.md"
          {
            echo "macOS 15 oder neuer · Apple Silicon. DMG öffnen und **SyllaBeat** in den Programme-Ordner ziehen."
            echo
            echo "> Die App ist ad-hoc signiert (nicht notarisiert). Beim ersten Start meldet macOS, dass sie nicht geprüft werden kann: dann unter *Systemeinstellungen → Datenschutz & Sicherheit* „Dennoch öffnen“ wählen."
            echo
            # Abschnitt dieser Version aus CHANGELOG.md (bis zur nächsten Versionsüberschrift).
            awk -v version="$VERSION" '
              $0 ~ "^## " version " " { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md
            echo
            echo "SHA-256: \`$(cut -d' ' -f1 "$DMG.sha256")\`"
          } > "$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" "$DMG.sha256" --clobber
          else
            FLAGS=()
            [[ "$PRERELEASE" == "true" ]] && FLAGS+=(--prerelease)
            [[ "$DRAFT" == "true" ]] && FLAGS+=(--draft)
            gh release create "$TAG" "$DMG" "$DMG.sha256" --target "$GITHUB_SHA" \
              --title "SyllaBeat $VERSION" --notes-file "$NOTES" "${FLAGS[@]}"
          fi
