name: Tests

# Fast, inexpensive checks on every push and pull request. The macOS-only parts
# (MLX Whisper, Metal, macOS rename syscalls) are skipped here and run in the
# release workflow on Apple Silicon.

on:
  push:
    branches: ["main"]
    paths-ignore: ["**.md", "BEDIENUNG.html"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: System packages (ffmpeg, Qt runtime libraries)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0
      - name: Python packages (without Apple-only MLX)
        run: |
          python -m pip install "PySide6>=6.8,<7" opencv-python-headless "librosa>=0.11" "opentimelineio>=0.18" "requests>=2.32" certifi
      - name: Lint (pyflakes rules)
        run: |
          python -m pip install ruff
          ruff check --select F,E9 syllabeat main.py scripts tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
