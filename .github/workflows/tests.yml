name: Tests

# swift: SyllaBeat 0.3 (Swift) auf Apple Silicon mit Xcode 27 – dieselben Prüfungen wie scripts/check.sh.
# python: SyllaBeat 0.2 (Python), solange der Python-Code im Repository liegt.

on:
  push:
    branches: ["main", "next/0.3"]
    paths-ignore: ["**.md", "BEDIENUNG.html", "work/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Werkzeuge
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Metal-Toolchain (für MLX-Shader)
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Prüfungen (scripts/check.sh)
        run: scripts/ci-run.sh 1200 scripts/check.sh
      - name: OTIO-Exporte mit OpenTimelineIO einlesen
        run: |
          for fixture in tests/Fixtures/golden-v0.2.0/g*/project.v1.json; do
            name=$(basename "$(dirname "$fixture")")
            swift run --package-path Packages/SyllaBeatKit --quiet sbtool export "$fixture" "build/otio/$name" --ohne-pruefung
          done
          python3 -m venv build/otio-venv
          build/otio-venv/bin/pip install --quiet "opentimelineio>=0.18"
          build/otio-venv/bin/python tools/validate_otio.py build/otio/*/*.otio
      - name: Testergebnisse bei Fehlern sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-logs
          path: build/DerivedData/Logs
          retention-days: 7

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: System packages (ffmpeg, Qt runtime libraries)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0
      - name: Python packages (without Apple-only MLX)
        run: |
          python -m pip install "PySide6>=6.8,<7" opencv-python-headless "librosa>=0.11" "opentimelineio>=0.18" "requests>=2.32" certifi
      - name: Lint (pyflakes rules)
        run: |
          python -m pip install ruff
          ruff check --select F,E9 syllabeat main.py scripts tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
